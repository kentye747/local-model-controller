name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -W ignore::ResourceWarning -m unittest discover -p 'test_*.py'
      - run: python scripts/check_release.py
  native:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements-build.txt
      - run: ./build.sh
      - run: '"dist/Local Model Controller.app/Contents/MacOS/LocalModelControl" --check-localization'
      - name: Clean-profile native decoding
        shell: bash
        run: |
          sandbox_profile="$(mktemp -d)"
          export LMC_HOME="$sandbox_profile/home" LMC_DATA_DIR="$sandbox_profile/data" LMC_DISABLE_HERMES=1
          "dist/Local Model Controller.app/Contents/MacOS/LocalModelControl" --check-status
          "dist/Local Model Controller.app/Contents/MacOS/LocalModelControl" --check-history
